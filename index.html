    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:system-ui;background:#e9ecef;padding:16px}
        .page{background:#fff;border-radius:28px;padding:20px}
        .hidden{display:none}
        h1{text-align:center;color:#c62828;font-size:1.9rem}
        .tunisia{text-align:center;color:#444;font-weight:600;margin-top:4px}

<body>

<div id="homePage" class="page">
    <h1>🆘 SOS EMERGENZA</h1>
    <div class="tunisia">TUNISIA</div>

    <button class="big-btn" onclick="openApp()">🚑 AMBULANZA</button>
    <button class="big-btn" onclick="openApp()">👮 POLIZIA</button>
    <button class="big-btn" onclick="openApp()">🐾 VETERINARIO</button>
    <button class="big-btn" onclick="openApp()">🏥 CLINICA</button>
</div>

<div id="appPage" class="page hidden">
    <h2>APP SOS ATTIVA</h2>
    <button class="big-btn" onclick="backHome()">⬅ TORNA HOME</button>
</div>

<script>
function openApp(){
    document.getElementById("homePage").classList.add("hidden");
    document.getElementById("appPage").classList.remove("hidden");
}
function backHome(){
    document.getElementById("appPage").classList.add("hidden");
    document.getElementById("homePage").classList.remove("hidden");
}
</script>

</body>

<!DOCTYPE html>
<html lang="it">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff0000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icon-sos-192.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>SOS Drive - v0170</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #e9ecef;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container { max-width: 600px; width: 100%; margin: 0 auto; }
        .page { background: white; border-radius: 32px; padding: 24px 20px 32px; box-shadow: 0 8px 24px rgba(0,0,0,0.05); }
        .hidden { display: none !important; }
        .version-header { font-size: 0.7rem; text-align: center; color: #6c757d; border-bottom: 1px solid #dee2e6; padding-bottom: 10px; margin-bottom: 20px; }
        h1 { font-size: 1.9rem; text-align: center; color: #c62828; margin-bottom: 8px; font-weight: 700; }
        h2 { font-size: 1.5rem; text-align: center; color: #c62828; margin: 12px 0; font-weight: 600; }
        .grid-2 { display: flex; flex-direction: column; gap: 14px; margin: 24px 0; }
        .big-btn {
            background: #d32f2f; border: none; border-radius: 60px; padding: 16px;
            font-size: 1.3rem; font-weight: bold; color: white; cursor: pointer;
            transition: transform 0.1s; box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .big-btn:active { transform: scale(0.96); }
        .small-btn { padding: 10px 14px; font-size: 0.9rem; border-radius: 40px; font-weight: bold; cursor: pointer; color: white; border: none; flex: 1; text-align: center; background: #5f7f9e; }
        .btn-secondary { background: #1976d2; }
        .btn-gps { background: #2e7d32; }
        .btn-copy { background: #f57c00; }
        .btn-audio { background: #8e24aa; }
        .flex-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
        input, textarea { width: 100%; padding: 12px 16px; border-radius: 32px; border: 1px solid #ced4da; font-size: 0.9rem; font-family: monospace; }
        .info-card { background: #f8f9fa; border-radius: 24px; padding: 14px; margin: 16px 0; font-size: 0.85rem; border: 1px solid #e9ecef; }
        .notes-section { margin-top: 20px; background: #fff; border-radius: 24px; }
        .section-title { font-weight: bold; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .add-note-btn { background: #ff9800; border: none; border-radius: 40px; padding: 8px 16px; font-weight: bold; color: white; cursor: pointer; font-size: 0.8rem; }
        .note-item { background: #fff3e0; border-left: 6px solid #ffb300; border-radius: 48px; margin: 8px 0; display: flex; align-items: center; overflow: hidden; }
        .note-item.special { background: #e8f5e9; border-left: 6px solid #4caf50; }
        .note-number-btn { flex: 1; background: transparent; border: none; text-align: left; padding: 12px 16px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .note-number { background: #ffb300; color: white; padding: 4px 10px; border-radius: 20px; font-weight: bold; min-width: 35px; text-align: center; }
        .note-item.special .note-number { background: #4caf50; }
        .status-msg { font-size: 0.75rem; color: #d32f2f; margin-top: 4px; text-align: center; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .modal-content { background: white; border-radius: 24px; padding: 24px; width: 90%; max-width: 400px; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <!-- HOME PAGE -->
    <div id="homePage" class="page">
        <div class="version-header">📟 SOS Drive v0170 - Sistema Pronto</div>
        <h1>🆘 SOS EMERGENZA</h1>
        <div class="grid-2">
            <button class="big-btn service-sel" data-service="ambulanza">🚑 AMBULANZA</button>
            <button class="big-btn service-sel" data-service="polizia">👮 POLIZIA</button>
            <button class="big-btn service-sel" data-service="veterinario">🐾 VETERINARIO</button>
            <button class="big-btn service-sel" data-service="clinica">🏥 CLINICA</button>
        </div>
        <p style="text-align:center; font-size:0.7rem; color:#666;">Seleziona un servizio per gestire note e chiamate.</p>
    </div>

    <!-- EMERGENCY PAGE -->
    <div id="emergencyPage" class="page hidden">
        <h2 id="serviceTitle">SERVIZIO</h2>
        
        <div class="flex-row">
            <input type="tel" id="phoneNumber" placeholder="Numero">
            <button id="registerNumberBtn" class="small-btn btn-secondary">REGISTRA</button>
        </div>

        <button id="geolocationBtn" class="small-btn btn-gps" style="width:100%; margin-bottom:10px;">📍 CARICA POSIZIONE</button>

        <div class="info-card">
            <div><strong>📌 POS:</strong> <span id="latLonDisplay">---</span></div>
            <div><strong>🏠 IND:</strong> <span id="addressDisplay">---</span></div>
            <div id="gpsStatus" class="status-msg"></div>
        </div>

        <div class="notes-section">
            <div class="section-title"><span>📋 Note Normali</span> <button onclick="addNewNote('normal')" class="add-note-btn">➕ AGGIUNGI</button></div>
            <div id="normalNotesListArea"></div>
        </div>

        <div class="notes-section">
            <div class="section-title"><span>✨ Note Speciali</span> <button onclick="addNewNote('special')" class="add-note-btn">➕ AGGIUNGI</button></div>
            <div id="specialNotesListArea"></div>
        </div>

        <div class="flex-row" style="margin-top:20px;">
            <button id="audioItBtn" class="small-btn btn-audio">🔊 IT</button>
            <button id="audioFrBtn" class="small-btn btn-audio">🔊 FR</button>
            <button id="backHomeBtn" class="small-btn" style="background:#607d8b;">◀ INDIETRO</button>
        </div>
    </div>
</div>

<script>
    const VERSION = "0170";
    let currentService = "";
    let normalNotes = [];
    let specialNotes = [];
    let selectedNote = null;

    // Inizializzazione Pulsanti Home
    document.querySelectorAll('.service-sel').forEach(btn => {
        btn.onclick = () => {
            currentService = btn.getAttribute('data-service');
            openServicePage();
        };
    });

    function openServicePage() {
        document.getElementById('homePage').classList.add('hidden');
        document.getElementById('emergencyPage').classList.remove('hidden');
        document.getElementById('serviceTitle').innerText = currentService.toUpperCase();
        loadData();
    }

    document.getElementById('backHomeBtn').onclick = () => {
        document.getElementById('emergencyPage').classList.add('hidden');
        document.getElementById('homePage').classList.remove('hidden');
    };

    // Funzione Aggiunta Nota (CORRETTA)
    function addNewNote(type) {
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-content">
                <h3>Nuova Nota ${type === 'normal' ? 'Normale' : 'Speciale'}</h3>
                <input type="text" id="modalTitle" placeholder="Titolo" style="margin: 10px 0;">
                <textarea id="modalDesc" placeholder="Contenuto..." rows="4"></textarea>
                <div class="modal-buttons">
                    <button id="confirmCrea" class="small-btn" style="background:#2e7d32;">✅ CREA</button>
                    <button id="closeModal" class="small-btn" style="background:#757575;">ANNULLA</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);

        // Correzione: Evento click su CREA
        document.getElementById('confirmCrea').onclick = () => {
            const t = document.getElementById('modalTitle').value;
            const d = document.getElementById('modalDesc').value;
            if(!t) return alert("Inserisci un titolo");

            const newNote = { id: Date.now(), titolo: t, descrizione: d };
            if(type === 'normal') normalNotes.push(newNote);
            else specialNotes.push(newNote);

            saveData();
            renderNotes();
            modal.remove();
        };

        document.getElementById('closeModal').onclick = () => modal.remove();
    }

    function renderNotes() {
        const nList = document.getElementById('normalNotesListArea');
        const sList = document.getElementById('specialNotesListArea');
        
        nList.innerHTML = normalNotes.length ? "" : "<p style='font-size:0.7rem; color:grey;'>Nessuna nota.</p>";
        sList.innerHTML = specialNotes.length ? "" : "<p style='font-size:0.7rem; color:grey;'>Nessuna nota.</p>";

        const createItem = (note, type) => {
            const div = document.createElement('div');
            div.className = `note-item ${type === 'special' ? 'special' : ''}`;
            div.innerHTML = `
                <button class="note-number-btn">
                    <span class="note-number">${type === 'normal' ? 'N' : 'S'}</span>
                    <span>${note.titolo}</span>
                </button>
            `;
            
            // Logica Pressione
            let timer;
            const start = () => {
                timer = setTimeout(() => {
                    if(confirm("Eliminare la nota?")) {
                        if(type === 'normal') normalNotes = normalNotes.filter(x => x.id !== note.id);
                        else specialNotes = specialNotes.filter(x => x.id !== note.id);
                        saveData(); renderNotes();
                    }
                }, 2000); // Long press 2s per eliminare (semplificato per stabilità)
            };
            const stop = () => {
                clearTimeout(timer);
                selectedNote = note;
                document.getElementById('gpsStatus').innerText = "Selezionato: " + note.titolo;
            };

            div.onmousedown = start;
            div.ontouchstart = start;
            div.onmouseup = stop;
            div.ontouchend = stop;

            return div;
        };

        normalNotes.forEach(n => nList.appendChild(createItem(n, 'normal')));
        specialNotes.forEach(n => sList.appendChild(createItem(n, 'special')));
    }

    function saveData() {
        localStorage.setItem(`notes_${currentService}_n`, JSON.stringify(normalNotes));
        localStorage.setItem(`notes_${currentService}_s`, JSON.stringify(specialNotes));
    }

    function loadData() {
        const n = localStorage.getItem(`notes_${currentService}_n`);
        const s = localStorage.getItem(`notes_${currentService}_s`);
        normalNotes = n ? JSON.parse(n) : [];
        specialNotes = s ? JSON.parse(s) : [];
        renderNotes();
    }

    // GPS Semplificato
    document.getElementById('geolocationBtn').onclick = () => {
        document.getElementById('gpsStatus').innerText = "Ricerca in corso...";
        navigator.geolocation.getCurrentPosition(p => {
            const coords = `${p.coords.latitude.toFixed(4)}, ${p.coords.longitude.toFixed(4)}`;
            document.getElementById('latLonDisplay').innerText = coords;
            document.getElementById('gpsStatus').innerText = "✅ Posizione acquisita";
        }, () => {
            document.getElementById('gpsStatus').innerText = "❌ Errore GPS";
        });
    };
    
    // Audio (Semplice)
    function speak(lang) {
        if(!selectedNote) return alert("Seleziona una nota prima!");
        const msg = new SpeechSynthesisUtterance(selectedNote.descrizione || selectedNote.titolo);
        msg.lang = lang === 'it' ? 'it-IT' : 'fr-FR';
        window.speechSynthesis.speak(msg);
    }
    document.getElementById('audioItBtn').onclick = () => speak('it');
    document.getElementById('audioFrBtn').onclick = () => speak('fr');

</script>
</body>
</html>

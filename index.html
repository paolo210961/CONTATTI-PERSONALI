    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:system-ui;
            background:#e9ecef;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:12px;
        }
        .container{width:100%;max-width:600px}
        .page{
            background:#fff;
            border-radius:28px;
            padding:20px;
            box-shadow:0 8px 24px rgba(0,0,0,.08);
        }
        .hidden{display:none!important}
        h1,h2{text-align:center;color:#c62828}
        h1{font-size:1.8rem;margin-bottom:10px}
        h2{font-size:1.4rem;margin-bottom:10px}

        .grid-2{display:flex;flex-direction:column;gap:12px;margin:20px 0}
        .big-btn{
            background:#d32f2f;
            color:#fff;
            border:none;
            border-radius:50px;
            padding:14px;
            font-size:1.2rem;
            font-weight:700;
        }
        .big-btn:active{transform:scale(.97)}

        input,textarea{
            width:100%;
            padding:12px;
            border-radius:20px;
            border:1px solid #ccc;
        }

        .small-btn{
            padding:10px;
            border:none;
            border-radius:20px;
            color:#fff;
            background:#607d8b;
        }

        .info-card{
            background:#f5f5f5;
            padding:10px;
            border-radius:16px;
            font-size:.85rem;
        }
    </style>
</head>

<body>
<div class="container">

<!-- HOME -->
<div id="homePage" class="page">
    <h1>🆘 SOS EMERGENZA</h1>

    <div class="grid-2">
        <button class="big-btn" onclick="showEmergency('ambulanza')">🚑 AMBULANZA</button>
        <button class="big-btn" onclick="showEmergency('polizia')">👮 POLIZIA</button>
        <button class="big-btn" onclick="showEmergency('veterinario')">🐾 VETERINARIO</button>
        <button class="big-btn" onclick="showEmergency('clinica')">🏥 CLINICA</button>
    </div>
</div>

<!-- EMERGENZA -->
<div id="emergencyPage" class="page hidden">

    <h2 id="title">SERVIZIO</h2>

    <input id="phone" placeholder="Numero">

    <button class="small-btn" onclick="goHome()">⬅ Home</button>

</div>

</div>

<script>
let currentService=null;

/* FIX HOME TEXT SPORCO */
document.addEventListener("DOMContentLoaded",()=>{
    const home=document.getElementById("homePage");
    if(!home) return;
    home.childNodes.forEach(n=>{
        if(n.nodeType===3) n.textContent="";
    });
});

function showEmergency(s){
    currentService=s;
    document.getElementById("homePage").classList.add("hidden");
    document.getElementById("emergencyPage").classList.remove("hidden");

    document.getElementById("title").innerText=
        s==="ambulanza"?"🚑 AMBULANZA":
        s==="polizia"?"👮 POLIZIA":
        s==="veterinario"?"🐾 VETERINARIO":"🏥 CLINICA";
}

function goHome(){
    document.getElementById("emergencyPage").classList.add("hidden");
    document.getElementById("homePage").classList.remove("hidden");
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff0000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icon-sos-192.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>SOS Drive - Emergenza v0166</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: #e9ecef;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
        }
        .page {
            background: white;
            border-radius: 32px;
            padding: 24px 20px 32px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
        }
        .hidden {
            display: none !important;
        }
        .version-header {
            font-size: 0.7rem;
            text-align: center;
            color: #6c757d;
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.9rem;
            text-align: center;
            color: #c62828;
            margin: 0 0 8px 0;
            font-weight: 700;
        }
        h2 {
            font-size: 1.5rem;
            text-align: center;
            color: #c62828;
            margin: 12px 0;
            font-weight: 600;
        }
        .grid-2 {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin: 24px 0;
        }
        .big-btn {
            background: #d32f2f;
            border: none;
            border-radius: 60px;
            padding: 16px 12px;
            font-size: 1.3rem;
            font-weight: bold;
            color: white;
            width: 100%;
            text-align: center;
            cursor: pointer;
            transition: 0.05s linear;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .big-btn:active {
            transform: scale(0.97);
        }
        .btn-secondary {
            background: #1976d2;
        }
        .btn-copy {
            background: #f57c00;
        }
        .btn-audio {
            background: #8e24aa;
        }
        .btn-gps {
            background: #2e7d32;
        }
        .small-btn {
            padding: 10px 14px;
            font-size: 0.9rem;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            border: none;
            flex: 1;
            text-align: center;
            background: #5f7f9e;
        }
        .flex-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin: 12px 0;
        }
        input, textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 32px;
            border: 1px solid #ced4da;
            font-size: 0.9rem;
            background: #fff;
            font-family: inherit;
        }
        .info-card {
            background: #f8f9fa;
            border-radius: 24px;
            padding: 14px;
            margin: 16px 0;
            font-size: 0.9rem;
            word-break: break-word;
            border: 1px solid #e9ecef;
        }
        .notes-section {
            margin-top: 24px;
            margin-bottom: 24px;
            border-radius: 24px;
            padding: 4px 0;
        }
        .section-title {
            font-weight: bold;
            margin-bottom: 12px;
            font-size: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .add-note-btn {
            background: #ff9800;
            border: none;
            border-radius: 40px;
            padding: 8px 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .note-item {
            background: #fff3e0;
            border-left: 6px solid #ffb300;
            border-radius: 48px;
            margin: 8px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
        }
        .note-item.special {
            background: #e8f5e9;
            border-left: 6px solid #4caf50;
        }
        .note-number-btn {
            flex: 1;
            background: transparent;
            border: none;
            text-align: left;
            padding: 12px 16px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .note-number {
            font-weight: bold;
            background: #ffb300;
            color: #3e2723;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.9rem;
        }
        .note-item.special .note-number {
            background: #4caf50;
            color: white;
        }
        .delete-note {
            background: #e57373;
            border: none;
            border-radius: 30px;
            padding: 5px 14px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-right: 8px;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: white;
            border-radius: 32px;
            padding: 24px;
            width: 90%;
            max-width: 500px;
        }
        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            justify-content: flex-end;
        }
        .version-footer {
            text-align: center;
            font-size: 0.65rem;
            color: #adb5bd;
            margin-top: 24px;
            padding-top: 12px;
            border-top: 1px solid #e9ecef;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- HOME PAGE -->
    <div id="homePage" class="page">
        <div class="version-header">📟 SOS Drive v0166 - Correzione Editabilità</div>
        <h1>🆘 SOS EMERGENZA</h1>
        <div class="grid-2">
            <button class="big-btn" onclick="openService('ambulanza')">🚑 AMBULANZA</button>
            <button class="big-btn" onclick="openService('polizia')">👮 POLIZIA</button>
            <button class="big-btn" onclick="openService('veterinario')">🐾 VETERINARIO</button>
            <button class="big-btn" onclick="openService('clinica')">🏥 CLINICA</button>
        </div>
        <p style="text-align:center; font-size:0.75rem; color:#555;">📍 Click per aprire / Long press 2s modifica note</p>
    </div>

    <!-- EMERGENCY PAGE -->
    <div id="emergencyPage" class="page hidden">
        <h2 id="serviceTitle">SERVIZIO</h2>
        
        <label>📞 Numero servizio</label>
        <div class="flex-row">
            <input type="tel" id="phoneNumber" placeholder="Numero">
            <button onclick="saveCurrentPhone()" class="small-btn btn-secondary">REGISTRA</button>
        </div>

        <button id="geolocationBtn" class="small-btn btn-gps" style="width:100%; margin:10px 0;">📍 CARICA POSIZIONE</button>

        <div id="coordsContainer" class="info-card">
            <div><strong>🏠 INDIRIZZO:</strong> <span id="addressDisplay">---</span></div>
            <div id="gpsStatus" class="status-msg" style="font-size: 0.7rem; color: green; margin-top:5px;"></div>
        </div>

        <!-- NOTE NORMALI -->
        <div class="notes-section">
            <div class="section-title">
                <span>📋 Note normali</span>
                <button onclick="addNewNote('normal')" class="add-note-btn">➕ AGGIUNGI</button>
            </div>
            <div id="normalNotesListArea"></div>
        </div>

        <!-- NOTE SPECIALI -->
        <div class="notes-section">
            <div class="section-title">
                <span>✨ Note speciali</span>
                <button onclick="addNewNote('special')" class="add-note-btn" style="background:#4caf50;">➕ AGGIUNGI</button>
            </div>
            <div id="specialNotesListArea"></div>
        </div>

        <button onclick="goBack()" class="small-btn" style="background:#607d8b; width:100%; margin-top:20px;">◀ TORNA INDIETRO</button>
    </div>
</div>

<script>
    let currentService = "";
    let notes = { normal: [], special: [] };

    function openService(service) {
        currentService = service;
        document.getElementById('homePage').classList.add('hidden');
        document.getElementById('emergencyPage').classList.remove('hidden');
        document.getElementById('serviceTitle').innerText = service.toUpperCase();
        
        // Carica numero salvato
        document.getElementById('phoneNumber').value = localStorage.getItem('phone_' + service) || "";
        loadNotes();
    }

    function goBack() {
        document.getElementById('homePage').classList.remove('hidden');
        document.getElementById('emergencyPage').classList.add('hidden');
    }

    function saveCurrentPhone() {
        const val = document.getElementById('phoneNumber').value;
        localStorage.setItem('phone_' + currentService, val);
        alert("Numero salvato!");
    }

    function loadNotes() {
        const savedNormal = JSON.parse(localStorage.getItem(`notes_${currentService}_normal`)) || [];
        const savedSpecial = JSON.parse(localStorage.getItem(`notes_${currentService}_special`)) || [];
        notes.normal = savedNormal;
        notes.special = savedSpecial;
        renderNotes('normal');
        renderNotes('special');
    }

    function renderNotes(type) {
        const area = document.getElementById(type + 'NotesListArea');
        area.innerHTML = "";
        notes[type].forEach((note, index) => {
            const div = document.createElement('div');
            div.className = `note-item ${type === 'special' ? 'special' : ''}`;
            div.innerHTML = `
                <button class="note-number-btn" onmousedown="startTimer(event, '${type}', ${index})" onmouseup="stopTimer()" ontouchstart="startTimer(event, '${type}', ${index})" ontouchend="stopTimer()">
                    <span class="note-number">${index + 1}</span>
                    <span>${note.title}</span>
                </button>
                <button class="delete-note" onclick="deleteNote('${type}', ${index})">🗑️</button>
            `;
            area.appendChild(div);
        });
    }

    function addNewNote(type) {
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-content">
                <h3>Nuova Nota ${type}</h3>
                <input type="text" id="m_title" placeholder="Titolo" style="margin-bottom:10px">
                <textarea id="m_desc" placeholder="Descrizione" rows="4"></textarea>
                <div class="modal-buttons">
                    <button class="small-btn" style="background:#4caf50" id="btn_confirm_create">✅ CREA</button>
                    <button class="small-btn" style="background:#9e9e9e" onclick="this.closest('.modal').remove()">ANNULLA</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);

        // Correzione: il tasto ora è cliccabile e salva correttamente
        document.getElementById('btn_confirm_create').onclick = function() {
            const title = document.getElementById('m_title').value;
            const desc = document.getElementById('m_desc').value;
            if(!title) return alert("Inserisci un titolo");
            
            notes[type].push({ title, desc });
            localStorage.setItem(`notes_${currentService}_${type}`, JSON.stringify(notes[type]));
            renderNotes(type);
            modal.remove();
        };
    }

    function deleteNote(type, index) {
        if(confirm("Eliminare nota?")) {
            notes[type].splice(index, 1);
            localStorage.setItem(`notes_${currentService}_${type}`, JSON.stringify(notes[type]));
            renderNotes(type);
        }
    }

    // Gestione Long Press per Modifica
    let timer;
    function startTimer(e, type, index) {
        timer = setTimeout(() => {
            openEditModal(type, index);
        }, 1000); // 1 secondo per modificare
    }
    function stopTimer() {
        clearTimeout(timer);
    }

    function openEditModal(type, index) {
        const note = notes[type][index];
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-content">
                <h3>Modifica Nota</h3>
                <input type="text" id="e_title" value="${note.title}" style="margin-bottom:10px">
                <textarea id="e_desc" rows="4">${note.desc}</textarea>
                <div class="modal-buttons">
                    <button class="small-btn" style="background:#4caf50" id="btn_save_edit">💾 SALVA</button>
                    <button class="small-btn" style="background:#9e9e9e" onclick="this.closest('.modal').remove()">CHIUDI</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);

        document.getElementById('btn_save_edit').onclick = function() {
            notes[type][index].title = document.getElementById('e_title').value;
            notes[type][index].desc = document.getElementById('e_desc').value;
            localStorage.setItem(`notes_${currentService}_${type}`, JSON.stringify(notes[type]));
            renderNotes(type);
            modal.remove();
        };
    }
</script>
</body>
</html>

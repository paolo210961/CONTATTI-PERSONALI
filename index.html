<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>SOS Drive - Emergenza</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #e9ecef; padding: 16px; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { max-width: 600px; width: 100%; margin: 0 auto; }
        .page { background: white; border-radius: 32px; padding: 24px 20px 32px; box-shadow: 0 8px 24px rgba(0,0,0,0.05); }
        .hidden { display: none !important; }
        h1 { font-size: 1.9rem; text-align: center; color: #c62828; margin-bottom: 8px; }
        h2 { font-size: 1.5rem; text-align: center; color: #c62828; margin: 12px 0; }
        .grid-2 { display: flex; flex-direction: column; gap: 14px; margin: 24px 0; }
        .big-btn { background: #d32f2f; border: none; border-radius: 60px; padding: 16px 12px; font-size: 1.3rem; font-weight: bold; color: white; width: 100%; text-align: center; cursor: pointer; transition: 0.05s linear; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        .big-btn:active { transform: scale(0.97); }
        .small-btn { padding: 10px 14px; font-size: 0.9rem; border-radius: 40px; font-weight: bold; cursor: pointer; color: white; border: none; background: #607d8b; }
        .back-home { background: #607d8b; width: 100%; margin-top: 20px; }
        .version-footer { text-align: center; font-size: 0.65rem; color: #adb5bd; margin-top: 24px; padding-top: 12px; border-top: 1px solid #e9ecef; }
        .info-card { background: #f8f9fa; border-radius: 24px; padding: 14px; margin: 16px 0; font-size: 0.9rem; word-break: break-word; border: 1px solid #e9ecef; }
        .flex-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
        input, textarea { width: 100%; padding: 12px 16px; border-radius: 32px; border: 1px solid #ced4da; font-size: 0.9rem; background: #fff; font-family: monospace; }
        .status-msg { font-size: 0.7rem; color: #2c3e66; margin-top: 6px; }
    </style>
</head>
<body>
<div class="container">
    <!-- HOME PAGE -->
    <div id="homePage" class="page">
        <h1>🆘 SOS EMERGENZA</h1>
        <div class="grid-2">
            <button class="big-btn" data-service="ambulanza">🚑 AMBULANZA</button>
            <button class="big-btn" data-service="polizia">👮 POLIZIA</button>
            <button class="big-btn" data-service="veterinario">🐾 VETERINARIO</button>
            <button class="big-btn" data-service="clinica">🏥 CLINICA</button>
        </div>
        <div class="version-footer">versione test – solo pulsanti emergenza (senza manifest)</div>
    </div>

    <!-- EMERGENCY PAGE -->
    <div id="emergencyPage" class="page hidden">
        <h2 id="serviceTitle">AMBULANZA</h2>

        <label>📞 Numero servizio</label>
        <div class="flex-row">
            <input type="tel" id="phoneNumber" placeholder="Numero" style="flex:2;">
            <button id="registerNumberBtn" class="small-btn" style="background:#1976d2; flex:0.4;">REGISTRA NUMERO</button>
        </div>
        <div id="phoneSaveMsg" class="status-msg"></div>

        <button id="googleMapsBtn" class="small-btn" style="background:#1976d2; width:100%; margin:4px 0;">🗺️ APRI GOOGLE MAPS</button>
        <button id="geolocationBtn" class="small-btn" style="background:#2e7d32; width:100%; margin:4px 0;">📍 CARICA POSIZIONE + INDIRIZZO</button>

        <div id="coordsContainer" class="info-card">
            <div><strong>📌 COORDINATE:</strong> <span id="latLonDisplay">---</span></div>
            <div><strong>🏠 INDIRIZZO:</strong> <span id="addressDisplay">---</span></div>
            <div><strong>📍 SONO VICINO A (1):</strong> <span id="refADisplay">---</span></div>
            <div><strong>📍 SONO VICINO A (2):</strong> <span id="refBDisplay">---</span></div>
            <div><strong>📍 SONO VICINO A (3):</strong> <span id="refCDisplay">---</span></div>
            <div id="gpsStatus" class="status-msg"></div>
        </div>

        <div class="flex-row">
            <input type="text" id="newNoteInput" placeholder="Nuova nota (italiano)" style="flex:3;">
            <button id="addNoteBtn" class="small-btn" style="background:#ff9800;">➕ AGGIUNGI</button>
        </div>

        <div id="notesListArea">
            <div style="font-size:0.7rem; color:#777;">Nessuna nota. Aggiungine una.</div>
        </div>

        <div class="flex-row">
            <button id="copyBtn" class="small-btn" style="background:#f57c00;">📋 COPIA (FR+IT)</button>
            <button id="audioItBtn" class="small-btn" style="background:#8e24aa;">🔊 LEGGI IT</button>
            <button id="audioFrBtn" class="small-btn" style="background:#8e24aa;">🔊 LEGGI FR</button>
        </div>

        <button id="backHomeBtn" class="small-btn back-home">◀ TORNA INDIETRO</button>
        <div class="version-footer">versione test – funzionalità base senza manifest</div>
    </div>
</div>

<script>
    // Versione di test per GitHub Pages (senza manifest)
    const homePage = document.getElementById('homePage');
    const emergencyPage = document.getElementById('emergencyPage');
    const serviceTitleSpan = document.getElementById('serviceTitle');
    const phoneInput = document.getElementById('phoneNumber');
    const registerNumberBtn = document.getElementById('registerNumberBtn');
    const googleMapsBtn = document.getElementById('googleMapsBtn');
    const geolocationBtn = document.getElementById('geolocationBtn');
    const addNoteBtn = document.getElementById('addNoteBtn');
    const copyBtn = document.getElementById('copyBtn');
    const audioItBtn = document.getElementById('audioItBtn');
    const audioFrBtn = document.getElementById('audioFrBtn');
    const backHomeBtn = document.getElementById('backHomeBtn');
    const latLonDisplay = document.getElementById('latLonDisplay');
    const addressDisplay = document.getElementById('addressDisplay');
    const refADisplay = document.getElementById('refADisplay');
    const refBDisplay = document.getElementById('refBDisplay');
    const refCDisplay = document.getElementById('refCDisplay');
    const gpsStatus = document.getElementById('gpsStatus');
    const phoneSaveMsg = document.getElementById('phoneSaveMsg');
    const notesListArea = document.getElementById('notesListArea');
    const newNoteInput = document.getElementById('newNoteInput');

    let currentService = "ambulanza";
    let currentLat = null, currentLng = null;
    let notesArray = [];

    // Funzioni di utilità
    function escapeHtml(str) { return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

    // Numeri di telefono
    function savePhone(s,n) { localStorage.setItem(`phone_${s}`, n); }
    function getPhone(s) { return localStorage.getItem(`phone_${s}`); }
    const defaultPhone = { ambulanza:"118", polizia:"113", veterinario:"800123456", clinica:"800987654" };

    // Note
    function getNotesKey() { return `notes_${currentService}`; }
    function saveNotes() { localStorage.setItem(getNotesKey(), JSON.stringify(notesArray)); }
    function loadNotes() {
        let stored = localStorage.getItem(getNotesKey());
        if (stored) { try { notesArray = JSON.parse(stored); } catch(e) { notesArray = []; } } else { notesArray = []; }
        renderNotes();
    }
    function renderNotes() {
        if (!notesArray.length) { notesListArea.innerHTML = `<div style="font-size:0.7rem; color:#777;">Nessuna nota. Aggiungine una.</div>`; return; }
        let html = '<div><strong>📋 Note:</strong></div>';
        notesArray.forEach((note, idx) => {
            html += `<div style="background:#faf0e6; padding:8px 12px; margin:8px 0; border-radius:48px; display:flex; justify-content:space-between; align-items:center;">
                        <span>${idx+1}. ${escapeHtml(note)}</span>
                        <button class="delete-note" data-idx="${idx}" style="background:#e57373; border:none; border-radius:30px; padding:5px 14px; color:white;">🗑️</button>
                    </div>`;
        });
        notesListArea.innerHTML = html;
        document.querySelectorAll('.delete-note').forEach(btn => {
            btn.addEventListener('click', (e) => {
                let idx = parseInt(btn.getAttribute('data-idx'));
                notesArray.splice(idx, 1);
                saveNotes();
                renderNotes();
            });
        });
    }
    function addNote() {
        let text = newNoteInput.value.trim();
        if (!text) { alert("Scrivi una nota"); return; }
        notesArray.push(text);
        saveNotes();
        renderNotes();
        newNoteInput.value = '';
    }

    // Copia bilingue (semplificata)
    async function getBilingualCopy() {
        let noteIT = notesArray.map((n,i)=>`${i+1}. ${n}`).join('\n') || "nessuna nota";
        let coord = (currentLat && currentLng) ? `${currentLat.toFixed(6)}, ${currentLng.toFixed(6)}` : "non disponibili";
        let addr = "Indirizzo: " + (document.getElementById('addressDisplay')?.innerText || "non disponibile");
        let italian = `EMERGENZA ${currentService.toUpperCase()}\n\nNOTE:\n${noteIT}\n\nCOORDINATE: ${coord}\n${addr}`;
        let french = `URGENCE ${currentService.toUpperCase()}\n\nNOTES:\n${noteIT}\n\nCOORDONNÉES: ${coord}\n${addr}`;
        return french + "\n\n-----\n\n" + italian;
    }
    async function copyBilingual() {
        let txt = await getBilingualCopy();
        try { await navigator.clipboard.writeText(txt); alert("Copiato!"); } catch(e) { alert("Copia manuale non riuscita"); }
    }

    // Geolocalizzazione semplificata
    function getLocationAndAddress() {
        if (!navigator.geolocation) { gpsStatus.innerHTML = "❌ GPS non supportato"; return; }
        gpsStatus.innerHTML = "⏳ Acquisizione posizione...";
        navigator.geolocation.getCurrentPosition(async (position) => {
            currentLat = position.coords.latitude;
            currentLng = position.coords.longitude;
            latLonDisplay.innerText = `${currentLat.toFixed(6)}, ${currentLng.toFixed(6)}`;
            gpsStatus.innerHTML = "📍 Posizione acquisita!";
            try {
                const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${currentLat}&lon=${currentLng}&zoom=18&addressdetails=1&accept-language=it`;
                const response = await fetch(url, { headers: { 'User-Agent': 'SOSDrive/1.0' } });
                const data = await response.json();
                if (data && data.address) {
                    const road = data.address.road || "";
                    const house = data.address.house_number || "";
                    const city = data.address.city || data.address.town || "";
                    let addr = [];
                    if (road && house) addr.push(`${road} ${house}`);
                    else if (road) addr.push(road);
                    if (city) addr.push(city);
                    addressDisplay.innerText = addr.join(", ");
                } else { addressDisplay.innerText = "Indirizzo non trovato"; }
                refADisplay.innerText = "Punto di interesse 1 (esempio)";
                refBDisplay.innerText = "Punto di interesse 2 (esempio)";
                refCDisplay.innerText = "Punto di interesse 3 (esempio)";
                gpsStatus.innerHTML = "✅ Posizione aggiornata!";
            } catch(e) { gpsStatus.innerHTML = "❌ Errore geocoding"; }
        }, (error) => { gpsStatus.innerHTML = `❌ Errore GPS: ${error.message}`; });
    }

    // Lettura vocale semplificata
    function speakItalian() {
        let text = notesArray.join(". ") || "nessuna nota";
        let msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'it-IT';
        speechSynthesis.speak(msg);
    }
    function speakFrench() {
        let text = notesArray.join(". ") || "aucune note";
        let msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'fr-FR';
        speechSynthesis.speak(msg);
    }

    // Mostra schermata emergenza
    function showEmergency(service) {
        currentService = service;
        let label = { ambulanza:"🚑 AMBULANZA", polizia:"👮 POLIZIA", veterinario:"🐾 VETERINARIO", clinica:"🏥 CLINICA" }[service];
        serviceTitleSpan.innerText = label;
        let savedPhone = getPhone(service);
        phoneInput.value = (savedPhone !== null) ? savedPhone : defaultPhone[service];
        loadNotes();
        homePage.classList.add("hidden");
        emergencyPage.classList.remove("hidden");
        gpsStatus.innerHTML = "";
    }

    function onRegisterNumber() {
        let n = phoneInput.value.trim();
        if (n) { savePhone(currentService, n); phoneSaveMsg.innerText = "✅ Numero salvato"; setTimeout(()=>phoneSaveMsg.innerText="",2000); }
        else phoneSaveMsg.innerText = "⚠️ Inserisci un numero valido";
    }

    function backHome() {
        emergencyPage.classList.add("hidden");
        homePage.classList.remove("hidden");
    }

    // Inizializzazione
    document.querySelectorAll('.big-btn').forEach(btn => {
        btn.addEventListener('click', () => showEmergency(btn.getAttribute('data-service')));
    });
    registerNumberBtn.addEventListener('click', onRegisterNumber);
    googleMapsBtn.addEventListener('click', () => window.open("https://maps.google.com", "_blank"));
    geolocationBtn.addEventListener('click', getLocationAndAddress);
    addNoteBtn.addEventListener('click', addNote);
    copyBtn.addEventListener('click', copyBilingual);
    audioItBtn.addEventListener('click', speakItalian);
    audioFrBtn.addEventListener('click', speakFrench);
    backHomeBtn.addEventListener('click', backHome);
</script>
</body>
</html>

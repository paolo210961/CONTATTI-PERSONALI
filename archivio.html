<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Expat Archivio + Convertitore (Tasso manuale)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{font-family:system-ui,'Segoe UI',Roboto,Helvetica,sans-serif;background:#e9ecef;padding:16px;min-height:100vh}
        .container{max-width:600px;margin:0 auto}
        .page{background:white;border-radius:32px;padding:20px 16px 24px;box-shadow:0 8px 24px rgba(0,0,0,0.05)}
        .archivio-title{background:linear-gradient(135deg,#1e2a3a,#2c3e66);border-radius:60px;padding:12px;font-size:1.3rem;font-weight:bold;color:white;text-align:center;margin-bottom:16px;display:flex;align-items:center;justify-content:center;gap:10px;user-select:none;-webkit-user-select:none}
        
        /* Stile base pulsanti */
        button{border:none;color:white;padding:12px 16px;border-radius:60px;font-size:0.95rem;font-weight:bold;cursor:pointer;transition:0.05s linear;width:100%}
        
        /* Solo alcuni pulsanti hanno l'effetto di ridimensionamento */
        .genius-btn:active,
        .select-folder-btn:active,
        .invite-btn:active,
        .circolare-btn:active,
        .attach-pdf-btn:active,
        .info-circle-btn:active {
            transform: scale(0.97);
        }
        
        /* I pulsanti CALCOLATRICE e TASSO BCT non hanno alcun effetto, neanche transizione */
        .calc-btn, .bct-btn {
            transition: none;
        }
        .calc-btn:active, .bct-btn:active,
        .calc-btn:focus, .bct-btn:focus {
            transform: none !important;
            scale: 1 !important;
            transition: none;
        }
        
        .genius-btn{background:#FF6600;display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:12px}
        .select-folder-btn{background:#283593;margin-bottom:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 16px}
        .dark-card{background:#d2d6dc;border-left:6px solid #2c3e50;border-radius:24px;padding:12px;margin:16px 0}
        .message-box{background:white;border-radius:20px;padding:20px 16px;text-align:center;border:1px solid #ced4da}
        .file-list{max-height:400px;overflow-y:auto}
        .doc-item{display:flex;align-items:center;justify-content:space-between;background:white;border:1px solid #ced4da;border-radius:40px;padding:8px 12px;margin:6px 0;flex-wrap:wrap;gap:8px}
        .doc-name{font-family:monospace;font-size:0.75rem;word-break:break-all;flex:1;min-width:120px}
        .doc-actions{display:flex;gap:6px;flex-shrink:0}
        .doc-view,.doc-download{font-size:1.1rem;cursor:pointer;background:none;border:none;padding:4px 8px;width:auto}
        .doc-view{color:#0066cc}
        .doc-download{color:#28a745}
        .converter-section{margin-top:16px}
        .converter-row{display:flex;align-items:center;justify-content:space-between;background:#f8f9fa;border-radius:60px;padding:6px 10px;margin-bottom:8px;gap:8px;flex-wrap:nowrap;overflow-x:auto}
        .currency-from{display:flex;align-items:center;gap:6px;flex-shrink:0}
        .currency-from .eur-symbol{font-weight:bold;font-size:0.85rem;min-width:45px;color:#004C97}
        .currency-from .tnd-symbol{font-weight:bold;font-size:0.85rem;min-width:45px;color:#E70000}
        .currency-from input.eur-field{width:120px;padding:8px 6px;border:1px solid #ced4da;border-radius:40px;font-size:0.85rem;text-align:center;background:#FFEB3B;font-weight:bold}
        .currency-from input.tnd-field{width:120px;padding:8px 6px;border:1px solid #ced4da;border-radius:40px;font-size:0.85rem;text-align:center;background:white;font-weight:normal}
        .arrow{font-size:0.9rem;flex-shrink:0;color:#6c757d}
        .result-value-eur{font-weight:bold;font-size:0.85rem;background:white;padding:6px 10px;border-radius:40px;min-width:105px;text-align:center;border:1px solid #ced4da;color:#004C97;flex-shrink:0}
        .result-value-tnd{font-weight:bold;font-size:0.85rem;background:white;padding:6px 10px;border-radius:40px;min-width:105px;text-align:center;border:1px solid #ced4da;color:#E70000;flex-shrink:0}
        .rate-row{display:flex;align-items:center;justify-content:space-between;background:#f8f9fa;border-radius:60px;padding:6px 10px;margin-bottom:8px;gap:8px;flex-wrap:wrap}
        .rate-label{font-weight:bold;font-size:0.85rem;color:#1e2a3a;flex-shrink:0;white-space:nowrap}
        .rate-input{width:130px;padding:8px 6px;border:1px solid #ced4da;border-radius:40px;font-size:0.95rem;font-weight:bold;text-align:center;background:#FFEB3B;flex-shrink:0}
        
        .double-buttons{display:flex;gap:12px;margin:12px 0 8px;align-items:center}
        .calc-btn, .bct-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
        .calc-btn{background:#283593}
        .bct-btn{background:#E70000 !important}
        
        .info-circle-btn{
            background:black;
            color:white;
            border-radius:50%;
            width:40px;
            height:40px;
            font-size:1.5rem;
            font-weight:normal;
            font-family:'Times New Roman',serif;
            font-style:italic;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            border:none;
            transition:0.05s linear;
            flex-shrink:0;
            padding:0;
        }
        
        .invite-btn{background:#4caf50;margin-top:12px;padding:14px;font-size:1rem;display:flex;align-items:center;justify-content:center;gap:10px}
        .circolare-btn{background:#8e44ad;margin-top:8px;padding:12px;font-size:0.9rem;display:flex;align-items:center;justify-content:center;gap:8px}
        .attach-pdf-btn{background:#8e44ad;margin-top:8px;padding:10px;font-size:0.9rem;display:flex;align-items:center;justify-content:center;gap:8px}
        .adaptive-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;justify-content:center;align-items:center;z-index:2000}
        .adaptive-modal-content{background:white;border-radius:32px;padding:20px;max-width:90%;max-height:80%;width:auto;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,0.3);overflow-y:auto}
        .preview-modal-content{max-width:500px}
        .preview-message-text{background:#f8f9fa;border-radius:16px;padding:16px;margin:16px 0;font-size:0.9rem;white-space:pre-wrap;word-break:break-word;border:1px solid #ced4da;max-height:300px;overflow-y:auto}
        .preview-message-text[contenteditable="true"]{background:white;border:2px solid #283593}
        .edit-note{font-size:0.7rem;color:#6c757d;text-align:center;margin-top:8px;cursor:pointer;text-decoration:underline}
        .modal-buttons{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
        .save-btn{background:#283593;color:white;border:none;padding:10px 20px;border-radius:40px;font-weight:bold}
        .cancel-btn{background:#8e44ad;color:white;border:none;padding:10px 20px;border-radius:40px;font-weight:bold}
        .error-message{background:#f8d7da;color:#721c24;padding:8px;border-radius:16px;text-align:center;margin-bottom:10px;font-size:0.7rem;display:none}
        .loading-small{text-align:center;color:#6c757d;padding:8px;font-size:0.7rem;display:none}
        iframe{width:100%;height:80%;border:none;min-height:500px}
        .info-rate-line{display:none}
    </style>
</head>
<body>
<div class="container">
    <div class="page">
        <div class="archivio-title">🗃️📄 EXPAT ARCHIVIO 🗃️📄</div>
        <button id="openGeniusScanBtn" class="genius-btn"><span class="genius-icon">📸</span> GENIUS SCAN <span class="genius-icon">📸</span></button>
        <button id="selectRootBtn" class="select-folder-btn"><span class="btn-line1">📂 Selezione-Visualizza 📂</span><span class="btn-line2">CARTELLA ARCHIVIO</span></button>
        <div class="dark-card"><div id="fileListArea" class="file-list"><div class="message-box"><div class="message-title">⚠️ PERMESSO SCADUTO</div><div class="message-text">Clicca sul Tasto Seleziona-Visualizza Cartella Archivio e concedi le autorizzazioni necessarie</div></div></div></div>
        <div class="converter-section">
            <div class="rate-row">
                <span class="rate-label">💱 CAMBIO TND:</span>
                <input type="number" id="exchangeRate" class="rate-input" step="0.0001" value="3.3937" placeholder="es. 3.3937">
            </div>
            <div id="converterContent">
                <div class="converter-row">
                    <div class="currency-from"><span class="eur-symbol">🇪🇺 EUR</span><input type="number" id="eurAmount" class="eur-field" step="any" placeholder="0" value="100"></div>
                    <span class="arrow">→</span>
                    <div class="result-value-tnd" id="eurToTndResult">--.-- TND</div>
                </div>
                <div class="converter-row">
                    <div class="currency-from"><span class="tnd-symbol">🇹🇳 TND</span><input type="number" id="tndAmount" class="tnd-field" step="any" placeholder="0" value="100"></div>
                    <span class="arrow">→</span>
                    <div class="result-value-eur" id="tndToEurResult">--.-- EUR</div>
                </div>
            </div>
            <div id="infoRateLine" class="info-rate-line"></div>
            <div class="double-buttons">
                <button id="openCalculatorBtn" class="calc-btn">🧮 CALCOLATRICE</button>
                <button id="infoBtn" class="info-circle-btn">𝒊</button>
                <button id="bctLinkBtn" class="bct-btn">🔗 TASSO BCT</button>
            </div>
            <button id="attachPdfBtn" class="attach-pdf-btn" style="display:none;"><i class="fas fa-paperclip"></i> Allega PDF all'invito (solo admin)</button>
            <button id="inviteFriendBtn" class="invite-btn"><i class="fab fa-whatsapp"></i> INVITA UN AMICO ALLA PROVA GRATUITA DEI 90gg</button>
            <button id="circolareBtn" class="circolare-btn"><i class="fas fa-file-pdf"></i> AdE - Circolare 20e - AIRE</button>
        </div>
    </div>
</div>
<div id="pdfModal" class="adaptive-modal" style="display:none;"><div class="adaptive-modal-content" style="width:90%; max-width:800px; height:80%;"><h3 id="pdfModalTitle">Documento PDF</h3><iframe id="pdfFrame" style="width:100%; height:80%; border:none;"></iframe><div class="modal-buttons"><button id="pdfDownloadBtn" class="save-btn" style="background:#4caf50;">📥 Scarica PDF</button><button id="pdfCloseBtn" class="cancel-btn">CHIUDI</button></div></div></div>
<script>
    const VERSION = "expat_archivio_manual_v13";
    let isInviteModalOpen = false;
    let currentPdfBlob = null, currentPdfUrl = null;
    let adminAuthenticated = false;

    function showPdfModal(blob, title) {
        const modal = document.getElementById('pdfModal');
        const iframe = document.getElementById('pdfFrame');
        const titleSpan = document.getElementById('pdfModalTitle');
        const downloadBtn = document.getElementById('pdfDownloadBtn');
        if (currentPdfUrl) URL.revokeObjectURL(currentPdfUrl);
        const url = URL.createObjectURL(blob);
        currentPdfUrl = url;
        currentPdfBlob = blob;
        iframe.src = url;
        titleSpan.innerText = title;
        modal.style.display = 'flex';
        downloadBtn.onclick = () => { const a = document.createElement('a'); a.href = url; a.download = title.replace(/[^a-z0-9]/gi, '_') + '.pdf'; a.click(); };
    }
    function closePdfModal() {
        const modal = document.getElementById('pdfModal');
        modal.style.display = 'none';
        const iframe = document.getElementById('pdfFrame');
        iframe.src = '';
        if (currentPdfUrl) { URL.revokeObjectURL(currentPdfUrl); currentPdfUrl = null; }
        currentPdfBlob = null;
    }
    document.getElementById('pdfCloseBtn').addEventListener('click', closePdfModal);
    document.getElementById('pdfModal').addEventListener('click', (e) => { if (e.target === document.getElementById('pdfModal')) closePdfModal(); });
    function isAndroid() { return /Android/.test(navigator.userAgent); }
    function isIPhone() { return /iPhone|iPad|iPod/.test(navigator.userAgent); }
    const selectRootBtn = document.getElementById('selectRootBtn');
    const openGeniusScanBtn = document.getElementById('openGeniusScanBtn');
    const infoBtn = document.getElementById('infoBtn');
    const fileListArea = document.getElementById('fileListArea');
    const openCalculatorBtn = document.getElementById('openCalculatorBtn');
    const inviteFriendBtn = document.getElementById('inviteFriendBtn');
    const attachPdfBtn = document.getElementById('attachPdfBtn');
    const circolareBtn = document.getElementById('circolareBtn');
    let rootHandle = null, currentFiles = [];
    let attachedPdfBase64 = localStorage.getItem('invite_pdf_base64') || null;
    let wakeLock = null;
    async function requestWakeLock() { if ('wakeLock' in navigator && !wakeLock) { try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e) { console.warn(e); } } }
    requestWakeLock();
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') requestWakeLock(); else if (wakeLock) { wakeLock.release(); wakeLock = null; } });
    let infoTexts = { expatArchivio: "📁 EXPAT ARCHIVIO (tasso manuale)\n\n• Seleziona una cartella (solo Android).\n• PDF visualizzabili e scaricabili.\n• Genius Scan per scansionare.\n• Convertitore: inserisci tu il tasso EUR/TND (es. dal sito BCT) e i calcoli sono automatici.\n\n" + (isIPhone() ? "⚠️ iPhone: selezione cartella non supportata." : "✅ Android: usa Chrome/Edge.") };
    const savedInfoTexts = localStorage.getItem('expatArchivioInfoText');
    if (savedInfoTexts) { try { const parsed = JSON.parse(savedInfoTexts); if (parsed.expatArchivio) infoTexts.expatArchivio = parsed.expatArchivio; } catch(e) {} }
    function saveInfoText() { localStorage.setItem('expatArchivioInfoText', JSON.stringify(infoTexts)); }
    function showInfo() { alert(infoTexts.expatArchivio); }
    let pressTimer = null;
    infoBtn.addEventListener('mousedown', () => { pressTimer = setTimeout(() => { let newText = prompt("Modifica il testo informativo (amministratore):", infoTexts.expatArchivio); if (newText !== null && newText.trim() !== "") { infoTexts.expatArchivio = newText.trim(); saveInfoText(); alert("Testo aggiornato!"); } }, 3000); });
    infoBtn.addEventListener('mouseup', () => clearTimeout(pressTimer));
    infoBtn.addEventListener('mouseleave', () => clearTimeout(pressTimer));
    infoBtn.addEventListener('touchstart', () => { pressTimer = setTimeout(() => { let newText = prompt("Modifica il testo informativo (amministratore):", infoTexts.expatArchivio); if (newText !== null && newText.trim() !== "") { infoTexts.expatArchivio = newText.trim(); saveInfoText(); alert("Testo aggiornato!"); } }, 3000); });
    infoBtn.addEventListener('touchend', () => clearTimeout(pressTimer));
    infoBtn.addEventListener('touchcancel', () => clearTimeout(pressTimer));
    function openHandleDB() { return new Promise((resolve, reject) => { const request = indexedDB.open('ExpatArchiveHandles', 1); request.onupgradeneeded = () => { const db = request.result; if (!db.objectStoreNames.contains('handles')) db.createObjectStore('handles'); }; request.onsuccess = () => resolve(request.result); request.onerror = () => reject(request.error); }); }
    async function saveRootHandle(handle) { const db = await openHandleDB(); const tx = db.transaction('handles', 'readwrite'); tx.objectStore('handles').put(handle, 'root'); await tx.done; }
    async function getRootHandle() { const db = await openHandleDB(); const tx = db.transaction('handles', 'readonly'); const result = await tx.objectStore('handles').get('root'); return result || null; }
    async function clearRootHandle() { const db = await openHandleDB(); const tx = db.transaction('handles', 'readwrite'); tx.objectStore('handles').delete('root'); await tx.done; }
    function showPermissionDenied() { fileListArea.innerHTML = `<div class="message-box"><div class="message-title">⚠️ PERMESSO SCADUTO</div><div class="message-text">Clicca sul Tasto Seleziona-Visualizza Cartella Archivio e concedi le autorizzazioni necessarie</div></div>`; }
    async function listPdfFiles() {
        if (!rootHandle) { showPermissionDenied(); return; }
        let isGranted = false;
        try { const permission = await rootHandle.queryPermission({ mode: 'read' }); isGranted = (permission === 'granted'); } catch(e) { isGranted = false; }
        if (!isGranted) { showPermissionDenied(); rootHandle = null; await clearRootHandle(); return; }
        const files = [];
        try { for await (const [name, handle] of rootHandle.entries()) { if (handle.kind === 'file' && name.toLowerCase().endsWith('.pdf')) files.push({ name, handle }); } } catch(e) { console.warn(e); showPermissionDenied(); rootHandle = null; await clearRootHandle(); return; }
        currentFiles = files;
        if (files.length === 0) { fileListArea.innerHTML = `<div class="message-box"><div class="message-title">📭 NESSUN PDF TROVATO</div><div class="message-text">Aggiungi file PDF nella cartella e riprova</div></div>`; return; }
        let html = "";
        for (const file of files) html += `<div class="doc-item"><span class="doc-name">📄 ${escapeHtml(file.name)}</span><div class="doc-actions"><button class="doc-view" data-name="${escapeHtml(file.name)}">🔍</button><button class="doc-download" data-name="${escapeHtml(file.name)}">📥</button></div></div>`;
        fileListArea.innerHTML = html;
        document.querySelectorAll('.doc-view').forEach(btn => { btn.addEventListener('click', async (e) => { const fileName = btn.getAttribute('data-name'); const file = currentFiles.find(f => f.name === fileName); if (file && file.handle) { const blob = await file.handle.getFile(); showPdfModal(blob, file.name); } else alert("Impossibile aprire il file."); }); });
        document.querySelectorAll('.doc-download').forEach(btn => { btn.addEventListener('click', async (e) => { const fileName = btn.getAttribute('data-name'); const file = currentFiles.find(f => f.name === fileName); if (file && file.handle) { const blob = await file.handle.getFile(); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = file.name; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); } else alert("Impossibile scaricare il file."); }); });
    }
    async function selectAndShowFolder() {
        if (isIPhone()) { alert("La selezione di una cartella non è supportata su iPhone."); showPermissionDenied(); return; }
        if (!window.showDirectoryPicker) { alert("Usa Chrome/Edge su Android."); showPermissionDenied(); return; }
        try { const handle = await window.showDirectoryPicker(); rootHandle = handle; await saveRootHandle(rootHandle); await listPdfFiles(); } catch(e) { if (e.name !== 'AbortError') { console.warn(e); alert("Errore selezione cartella."); showPermissionDenied(); } } }
    function openGeniusScan() {
        const isAndroid = /Android/.test(navigator.userAgent);
        const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
        let timeoutId = null, hasLostFocus = false;
        const onBlur = () => { hasLostFocus = true; if (timeoutId) clearTimeout(timeoutId); window.removeEventListener('blur', onBlur); };
        window.addEventListener('blur', onBlur);
        if (isAndroid) { window.location.href = "intent://scan/#Intent;package=com.thegrizzlylabs.geniusscan.free;scheme=zxing;end"; timeoutId = setTimeout(() => { if (!hasLostFocus && confirm("Genius Scan non si è aperto. Scaricare dal Play Store?")) window.open("https://play.google.com/store/apps/details?id=com.thegrizzlylabs.geniusscan.free", "_blank"); window.removeEventListener('blur', onBlur); }, 5000); }
        else if (isIOS) { window.location.href = "geniuscan://"; timeoutId = setTimeout(() => { if (!hasLostFocus && confirm("Genius Scan non si è aperto. Scaricare dall'App Store?")) window.open("https://apps.apple.com/app/genius-scan/id377672876", "_blank"); window.removeEventListener('blur', onBlur); }, 5000); }
        else alert("Link solo su mobile.");
    }
    function openSystemCalculator() {
        if (isAndroid()) { window.location.href = "intent://#Intent;package=com.sec.android.app.popupcalculator;scheme=android-app;end"; setTimeout(() => { window.location.href = "intent://#Intent;package=com.android.calculator2;scheme=android-app;end"; }, 500); }
        else { alert("Su iPhone/iPad, apri l'app Calcolatrice dal telefono."); }
    }
    async function uploadAttachedPdf() { if (!adminAuthenticated) { alert("Solo amministratore può caricare il PDF allegato."); return; } const input = document.createElement('input'); input.type = 'file'; input.accept = 'application/pdf'; input.onchange = async (e) => { const file = e.target.files[0]; if (file && file.type === 'application/pdf') { const reader = new FileReader(); reader.onload = (ev) => { attachedPdfBase64 = ev.target.result; localStorage.setItem('invite_pdf_base64', attachedPdfBase64); alert("✅ PDF allegato salvato (sostituisce il precedente)"); }; reader.readAsDataURL(file); } else { alert("Seleziona un file PDF valido."); } }; input.click(); }
    
    function openCircolare() {
        window.open('https://drive.google.com/file/d/1l6jadyjTlHcfEauNVPv-CPv00pl510jH/view?usp=sharing', '_blank');
    }
    
    function inviteFriend() {
        if (isInviteModalOpen) { alert("Attendi: la finestra di anteprima è già aperta."); return; }
        isInviteModalOpen = true;
        const appLink = "https://paolo210961.github.io/CONTATTI-PERSONALI/";
        let defaultMessage = "🎉 *Prova la app per 90 giorni gratuitamente!* 🎉\n\nGestisci documenti, converti valuta (EUR/TND tasso manuale), scannerizza con Genius Scan e organizza i tuoi PDF in una cartella.\n\n✅ Archivio PDF su cartella personale\n✅ Convertitore di valuta (tasso inserito manualmente)\n✅ Integrazione con Genius Scan\n✅ Visualizza e invia geolocalizzazione\n✅ Traduzione vocale automatica italiano ↔ francese\n\n👉 *Prova subito:* " + appLink;
        const modal = document.createElement('div'); modal.className = 'adaptive-modal'; modal.style.display = 'flex'; 
        const editable = adminAuthenticated ? 'true' : 'false';
        modal.innerHTML = `<div class="adaptive-modal-content preview-modal-content"><h3>📱 Anteprima messaggio</h3><div id="previewMessageText" class="preview-message-text" contenteditable="${editable}">${escapeHtml(defaultMessage)}</div>${adminAuthenticated ? '<div class="edit-note" id="editNoteToggle">✏️ Tocca per modificare il testo</div>' : '<div class="edit-note" style="color:#999;">🔒 Solo admin può modificare</div>'}<div class="modal-buttons" style="margin-top: 20px;"><button id="sendWhatsAppBtn" class="save-btn" style="background:#4caf50;">📤 INVIA SU WHATSAPP</button><button id="cancelPreviewBtn" class="cancel-btn">ANNULLA</button></div></div>`;
        document.body.appendChild(modal);
        const messageDiv = document.getElementById('previewMessageText');
        const sendBtn = document.getElementById('sendWhatsAppBtn');
        const cancelBtn = document.getElementById('cancelPreviewBtn');
        const editNote = document.getElementById('editNoteToggle');
        if (adminAuthenticated && editNote) {
            let isEditing = true;
            editNote.addEventListener('click', () => {
                isEditing = !isEditing;
                messageDiv.contentEditable = isEditing;
                editNote.innerText = isEditing ? "✏️ Tocca per modificare il testo" : "🔒 Modifica disattivata. Tocca per riattivare";
            });
        }
        const closeModal = () => { modal.remove(); isInviteModalOpen = false; };
        sendBtn.onclick = async () => { const finalMessage = messageDiv.innerText; const encodedMessage = encodeURIComponent(finalMessage); let whatsappUrl = `https://wa.me/?text=${encodedMessage}`; if (attachedPdfBase64) { const blob = await (await fetch(attachedPdfBase64)).blob(); const file = new File([blob], "allegato_invito.pdf", { type: 'application/pdf' }); if (navigator.share) { try { await navigator.share({ title: 'Invito app', text: finalMessage, files: [file] }); closeModal(); return; } catch (err) { console.warn(err); } } } window.open(whatsappUrl, '_blank'); closeModal(); };
        cancelBtn.onclick = closeModal; modal.onclick = (e) => { if (e.target === modal) closeModal(); };
    }
    function escapeHtml(str) { return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

    // ==================== CONVERTITORE ====================
    let updating = false;
    const eurInput = document.getElementById('eurAmount');
    const tndInput = document.getElementById('tndAmount');
    const eurToTndResult = document.getElementById('eurToTndResult');
    const tndToEurResult = document.getElementById('tndToEurResult');
    const exchangeRateInput = document.getElementById('exchangeRate');
    const infoRateLine = document.getElementById('infoRateLine');

    function updateFromEuro() {
        if (updating) return;
        updating = true;
        let rate = parseFloat(exchangeRateInput.value);
        if (isNaN(rate) || rate <= 0) {
            eurToTndResult.textContent = '? TND';
            updating = false;
            return;
        }
        let euro = parseFloat(eurInput.value);
        if (isNaN(euro)) euro = 0;
        let tnd = euro * rate;
        tndInput.value = tnd.toFixed(2);
        eurToTndResult.textContent = tnd.toFixed(3) + ' TND';
        let tndVal = parseFloat(tndInput.value);
        if (!isNaN(tndVal)) {
            let eurCalc = tndVal / rate;
            tndToEurResult.textContent = eurCalc.toFixed(3) + ' EUR';
        }
        updating = false;
    }

    function updateFromTnd() {
        if (updating) return;
        updating = true;
        let rate = parseFloat(exchangeRateInput.value);
        if (isNaN(rate) || rate <= 0) {
            tndToEurResult.textContent = '? EUR';
            updating = false;
            return;
        }
        let tnd = parseFloat(tndInput.value);
        if (isNaN(tnd)) tnd = 0;
        let euro = tnd / rate;
        eurInput.value = euro.toFixed(2);
        tndToEurResult.textContent = euro.toFixed(3) + ' EUR';
        let euroVal = parseFloat(eurInput.value);
        if (!isNaN(euroVal)) {
            let tndCalc = euroVal * rate;
            eurToTndResult.textContent = tndCalc.toFixed(3) + ' TND';
        }
        updating = false;
    }

    function updateFromRate() {
        if (updating) return;
        updating = true;
        let rate = parseFloat(exchangeRateInput.value);
        if (isNaN(rate) || rate <= 0) {
            eurToTndResult.textContent = '? TND';
            tndToEurResult.textContent = '? EUR';
            updating = false;
            return;
        }
        let euro = parseFloat(eurInput.value);
        if (!isNaN(euro)) {
            let tnd = euro * rate;
            tndInput.value = tnd.toFixed(2);
            eurToTndResult.textContent = tnd.toFixed(3) + ' TND';
            tndToEurResult.textContent = (tnd / rate).toFixed(3) + ' EUR';
        } else {
            let tnd = parseFloat(tndInput.value);
            if (!isNaN(tnd)) {
                let euroCalc = tnd / rate;
                eurInput.value = euroCalc.toFixed(2);
                tndToEurResult.textContent = euroCalc.toFixed(3) + ' EUR';
                eurToTndResult.textContent = tnd.toFixed(3) + ' TND';
            } else {
                eurInput.value = '0';
                tndInput.value = '0';
                eurToTndResult.textContent = '0.000 TND';
                tndToEurResult.textContent = '0.000 EUR';
            }
        }
        updating = false;
    }

    eurInput.addEventListener('input', updateFromEuro);
    tndInput.addEventListener('input', updateFromTnd);
    exchangeRateInput.addEventListener('input', updateFromRate);
    document.getElementById('bctLinkBtn').addEventListener('click', () => {
        window.open('https://www.bct.gov.tn/bct/siteprod/cours.jsp?utm_source=chatgpt.com', '_blank');
    });
    updateFromRate();

    function checkAdminPassword() {
        const password = prompt("Inserisci la password amministratore:");
        if (password === "admin2025") {
            adminAuthenticated = true;
            document.getElementById('attachPdfBtn').style.display = 'flex';
            alert("Modalità amministratore attivata.");
        } else if (password !== null) { alert("Password errata."); }
    }
    const titleBtn = document.querySelector('.archivio-title');
    titleBtn.addEventListener('dblclick', () => { checkAdminPassword(); });
    titleBtn.addEventListener('touchstart', (e) => { if (e.touches.length === 2) { checkAdminPassword(); } });

        const savedHandle = await getRootHandle();
        if (savedHandle) { rootHandle = savedHandle; await listPdfFiles(); }
        else showPermissionDenied();
        selectRootBtn.addEventListener('click', selectAndShowFolder);
        openGeniusScanBtn.addEventListener('click', openGeniusScan);
        infoBtn.addEventListener('click', showInfo);
        openCalculatorBtn.addEventListener('click', openSystemCalculator);
        inviteFriendBtn.addEventListener('click', inviteFriend);
        if (attachPdfBtn) attachPdfBtn.addEventListener('click', uploadAttachedPdf);
        circolareBtn.addEventListener('click', openCircolare);
    }
    init();
</script>

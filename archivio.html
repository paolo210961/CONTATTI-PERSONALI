<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Expat Archivio - Gestione PDF</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: #e9ecef;
            padding: 16px;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .page {
            background: white;
            border-radius: 32px;
            padding: 24px 20px 32px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
        }
        button {
            background: #0066cc;
            border: none;
            color: white;
            padding: 10px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.05s linear;
            margin: 4px;
            width: 100%;
        }
        button:active {
            transform: scale(0.96);
            background: #004999;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 32px;
            border: 1px solid #ced4da;
            font-size: 0.9rem;
            background: #fff;
            margin: 8px 0;
        }
        .archivio-title {
            background: #6c757d;
            border-radius: 60px;
            padding: 14px 12px;
            font-size: 1.3rem;
            font-weight: bold;
            color: white;
            text-align: center;
            margin-bottom: 20px;
        }
        .info-i-btn {
            background: #17a2b8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin: 8px auto;
            display: block;
        }
        .dark-card {
            background: #d2d6dc;
            border-left: 6px solid #2c3e50;
            border-radius: 24px;
            padding: 16px;
            margin: 16px 0;
        }
        .doc-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            border: 1px solid #ced4da;
            border-radius: 40px;
            padding: 10px 16px;
            margin: 8px 0;
        }
        .doc-name {
            font-family: monospace;
            font-size: 0.8rem;
            word-break: break-all;
            flex: 1;
        }
        .doc-open {
            font-size: 1.2rem;
            cursor: pointer;
            background: none;
            border: none;
            padding: 5px 10px;
        }
        .status-msg {
            font-size: 0.7rem;
            color: #2c3e66;
            margin-top: 6px;
            text-align: center;
        }
        .info-message-small {
            font-size: 0.7rem;
            color: #555;
            text-align: center;
            margin-top: 8px;
        }
        .flex-buttons {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .flex-buttons button {
            flex: 1;
            margin: 0;
        }
        hr {
            margin: 16px 0;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="page">
        <div class="archivio-title">📁 EXPAT ARCHIVIO</div>
        
        <!-- Campo anno modificabile e persistente -->
        <input type="text" id="yearInput" placeholder="Anno (opzionale)" maxlength="4" inputmode="numeric">
        
        <div class="flex-buttons">
            <button id="selectRootBtn" style="background:#283593;">📁 Seleziona-Visualizza cartella archivio</button>
            <button id="openGeniusScanBtn" style="background:#4caf50;">📱 APRI GENIUS SCAN</button>
        </div>
        
        <button id="openRootFolderBtn" style="background:#17a2b8;">📂 APRI CARTELLA ARCHIVIO</button>
        <button id="infoBtn" class="info-i-btn">i</button>
        
        <div class="dark-card" style="max-height: 450px; overflow-y: auto;">
            <div id="fileListArea" style="text-align:center; padding:20px; color:#777;">Seleziona una cartella per vedere i PDF</div>
        </div>
        
        <div class="info-message-small">
            ℹ️ I file PDF sono visualizzati dalla cartella che hai selezionato.<br>
            Per aprire un PDF, clicca su 🔍.
        </div>
    </div>
</div>

<script>
    // ==================== EXPAT ARCHIVIO (VERSIONE LEGGERA) ====================
    const VERSION = "expat_archivio_v1.0";
    
    // Rilevamento dispositivo
    function isAndroid() { return /Android/.test(navigator.userAgent); }
    function isIPhone() { return /iPhone|iPad|iPod/.test(navigator.userAgent); }
    
    // DOM elementi
    const yearInput = document.getElementById('yearInput');
    const selectRootBtn = document.getElementById('selectRootBtn');
    const openRootFolderBtn = document.getElementById('openRootFolderBtn');
    const openGeniusScanBtn = document.getElementById('openGeniusScanBtn');
    const infoBtn = document.getElementById('infoBtn');
    const fileListArea = document.getElementById('fileListArea');
    
    // Variabili
    let rootHandle = null;
    let currentFiles = [];   // array di { name, handle }
    
    // Persistenza anno
    function loadYear() {
        const saved = localStorage.getItem('expat_archivio_year');
        if (saved !== null) {
            yearInput.value = saved;
        }
    }
    function saveYear() {
        localStorage.setItem('expat_archivio_year', yearInput.value.trim());
    }
    yearInput.addEventListener('input', saveYear);
    yearInput.addEventListener('blur', saveYear);
    
    // Gestione cartella (IndexedDB per l'handle)
    function openHandleDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open('ExpatArchiveHandles', 1);
            request.onupgradeneeded = () => {
                const db = request.result;
                if (!db.objectStoreNames.contains('handles')) {
                    db.createObjectStore('handles');
                }
            };
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    }
    async function saveRootHandle(handle) {
        const db = await openHandleDB();
        const tx = db.transaction('handles', 'readwrite');
        tx.objectStore('handles').put(handle, 'root');
        await tx.done;
    }
    async function getRootHandle() {
        const db = await openHandleDB();
        const tx = db.transaction('handles', 'readonly');
        const result = await tx.objectStore('handles').get('root');
        return result || null;
    }
    
    async function selectAndShowFolder() {
        if (isIPhone()) {
            alert("La selezione di una cartella non è supportata su iPhone.");
            return;
        }
        if (!window.showDirectoryPicker) {
            alert("Il tuo browser non supporta la selezione di cartelle. Usa Chrome/Edge su Android.");
            return;
        }
        try {
            const handle = await window.showDirectoryPicker();
            rootHandle = handle;
            await saveRootHandle(rootHandle);
            showMessage(`✅ Cartella selezionata: "${rootHandle.name}"`);
            await listPdfFiles();
        } catch(e) {
            if (e.name !== 'AbortError') {
                console.warn(e);
                alert("Errore nella selezione della cartella.");
            }
        }
    }
    
    async function listPdfFiles() {
        if (!rootHandle) {
            fileListArea.innerHTML = "<div style='padding:20px;'>Nessuna cartella selezionata. Premi 'Seleziona-Visualizza cartella archivio'.</div>";
            return;
        }
        const files = [];
        try {
            for await (const [name, handle] of rootHandle.entries()) {
                if (handle.kind === 'file' && name.toLowerCase().endsWith('.pdf')) {
                    files.push({ name, handle });
                }
            }
        } catch(e) {
            console.warn(e);
            fileListArea.innerHTML = "<div style='padding:20px;'>Errore nella lettura della cartella.</div>";
            return;
        }
        currentFiles = files;
        if (files.length === 0) {
            fileListArea.innerHTML = "<div style='padding:20px;'>📭 Nessun file PDF trovato in questa cartella.</div>";
            return;
        }
        let html = "";
        for (const file of files) {
            html += `
                <div class="doc-item">
                    <span class="doc-name">📄 ${escapeHtml(file.name)}</span>
                    <button class="doc-open" data-name="${escapeHtml(file.name)}">🔍</button>
                </div>
            `;
        }
        fileListArea.innerHTML = html;
        // Aggiungi event listener per i pulsanti di apertura
        document.querySelectorAll('.doc-open').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const fileName = btn.getAttribute('data-name');
                const file = currentFiles.find(f => f.name === fileName);
                if (file && file.handle) {
                    const blob = await file.handle.getFile();
                    const url = URL.createObjectURL(blob);
                    window.open(url, '_blank');
                    setTimeout(() => URL.revokeObjectURL(url), 60000);
                } else {
                    alert("Impossibile aprire il file.");
                }
            });
        });
    }
    
    async function openRootFolderMessage() {
        if (!rootHandle) {
            const stored = await getRootHandle();
            if (stored) {
                rootHandle = stored;
            } else {
                alert("Nessuna cartella selezionata. Usa prima 'Seleziona-Visualizza cartella archivio'.");
                return;
            }
        }
        alert(`📂 La cartella selezionata è: "${rootHandle.name}"\n\nPuoi aprirla manualmente con un file manager.`);
    }
    
    // Genius Scan
    function openGeniusScan() {
        const isAndroid = /Android/.test(navigator.userAgent);
        const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
        let timeoutId = null;
        let hasLostFocus = false;
        const onBlur = () => {
            hasLostFocus = true;
            if (timeoutId) clearTimeout(timeoutId);
            window.removeEventListener('blur', onBlur);
        };
        window.addEventListener('blur', onBlur);
        if (isAndroid) {
            window.location.href = "intent://scan/#Intent;package=com.thegrizzlylabs.geniusscan.free;scheme=zxing;end";
            timeoutId = setTimeout(() => {
                if (!hasLostFocus) {
                    if (confirm("Genius Scan non si è aperto. Potrebbe non essere installato. Vuoi scaricarlo dal Play Store?")) {
                        window.open("https://play.google.com/store/apps/details?id=com.thegrizzlylabs.geniusscan.free", "_blank");
                    }
                }
                window.removeEventListener('blur', onBlur);
            }, 5000);
        } else if (isIOS) {
            window.location.href = "geniuscan://";
            timeoutId = setTimeout(() => {
                if (!hasLostFocus) {
                    if (confirm("Genius Scan non si è aperto. Potrebbe non essere installato. Vuoi scaricarlo dall'App Store?")) {
                        window.open("https://apps.apple.com/app/genius-scan/id377672876", "_blank");
                    }
                }
                window.removeEventListener('blur', onBlur);
            }, 5000);
        } else {
            alert("Questo link funziona solo su dispositivi mobili.");
        }
    }
    
    // Info
    function showInfo() {
        alert("📁 EXPAT ARCHIVIO\n\n• Seleziona una cartella sul tuo telefono (solo Android).\n• Verranno elencati tutti i file PDF presenti.\n• Clicca su 🔍 per aprire un PDF.\n• Genius Scan può essere usato per scansionare documenti, poi li esporti manualmente nella cartella selezionata.\n• Il campo ANNO è solo un promemoria (viene salvato automaticamente).\n\n" + (isIPhone() ? "⚠️ Su iPhone la selezione cartella non è supportata." : "✅ Android: usa Chrome o Edge per la selezione cartella."));
    }
    
    function showMessage(msg, isError = false) {
        const div = document.createElement('div');
        div.className = 'status-msg';
        div.style.color = isError ? 'red' : 'green';
        div.innerText = msg;
        const container = document.querySelector('.archivio-title');
        container.parentNode.insertBefore(div, container.nextSibling);
        setTimeout(() => div.remove(), 3000);
    }
    
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    // Inizializzazione
    async function init() {
        loadYear();
        // Recupera handle salvato
        const savedHandle = await getRootHandle();
        if (savedHandle) {
            rootHandle = savedHandle;
            showMessage(`📁 Cartella "${rootHandle.name}" già selezionata.`);
            await listPdfFiles();
        } else {
            fileListArea.innerHTML = "<div style='padding:20px;'>Nessuna cartella selezionata. Premi 'Seleziona-Visualizza cartella archivio'.</div>";
        }
        
        selectRootBtn.addEventListener('click', selectAndShowFolder);
        openRootFolderBtn.addEventListener('click', openRootFolderMessage);
        openGeniusScanBtn.addEventListener('click', openGeniusScan);
        infoBtn.addEventListener('click', showInfo);
    }
    init();
</script>
</body>
</html>

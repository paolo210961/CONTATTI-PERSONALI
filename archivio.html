<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Expat Archivio - Gestione PDF</title>
    <!-- FontAwesome per icone (opzionale, se vuoi icone più belle) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: #e9ecef;
            padding: 16px;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .page {
            background: white;
            border-radius: 32px;
            padding: 24px 20px 32px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
        }
        button {
            border: none;
            color: white;
            padding: 12px 16px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.05s linear;
            text-align: center;
        }
        button:active {
            transform: scale(0.96);
        }
        .full-width-btn {
            width: 100%;
            background: #283593;
            margin-bottom: 12px;
        }
        .row-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .row-buttons button {
            flex: 1;
        }
        .genius-btn {
            background: #4caf50;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .info-circle-btn {
            background: black;
            color: white;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            font-size: 1.5rem;
            font-weight: bold;
            font-family: 'Times New Roman', serif;
            font-style: italic;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            flex-shrink: 0;
        }
        .info-circle-btn:active {
            transform: scale(0.95);
        }
        .file-list {
            margin-top: 20px;
            max-height: 500px;
            overflow-y: auto;
        }
        .doc-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            border: 1px solid #ced4da;
            border-radius: 40px;
            padding: 10px 16px;
            margin: 8px 0;
        }
        .doc-name {
            font-family: monospace;
            font-size: 0.8rem;
            word-break: break-all;
            flex: 1;
        }
        .doc-open {
            font-size: 1.2rem;
            cursor: pointer;
            background: none;
            border: none;
            padding: 5px 10px;
        }
        .status-msg {
            font-size: 0.7rem;
            color: #2c3e66;
            margin-top: 6px;
            text-align: center;
        }
        /* Nascondi elementi rimossi */
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="page">
        <div class="archivio-title">📁 EXPAT ARCHIVIO</div>
        
        <!-- Pulsante Seleziona-Visualizza cartella archivio (full width) -->
        <button id="selectRootBtn" class="full-width-btn">📁 Seleziona-Visualizza cartella archivio</button>
        
        <!-- Riga con Genius Scan (logo) e pulsante info "i" -->
        <div class="row-buttons">
            <button id="openGeniusScanBtn" class="genius-btn">
                <i class="fas fa-camera"></i> <!-- icona FontAwesome, alternativa emoji: 📸 -->
                <span>GENIUS SCAN</span>
            </button>
            <button id="infoBtn" class="info-circle-btn">𝒊</button>
        </div>
        
        <!-- Lista PDF (senza box colorato) -->
        <div id="fileListArea" class="file-list">
            <div style="text-align:center; padding:20px; color:#777;">Seleziona una cartella per vedere i PDF</div>
        </div>
    </div>
</div>

<script>
    // ==================== EXPAT ARCHIVIO VERSIONE LEGGERA ====================
    const VERSION = "expat_archivio_v2.0";
    
    // Rilevamento dispositivo
    function isAndroid() { return /Android/.test(navigator.userAgent); }
    function isIPhone() { return /iPhone|iPad|iPod/.test(navigator.userAgent); }
    
    // DOM elementi
    const selectRootBtn = document.getElementById('selectRootBtn');
    const openGeniusScanBtn = document.getElementById('openGeniusScanBtn');
    const infoBtn = document.getElementById('infoBtn');
    const fileListArea = document.getElementById('fileListArea');
    
    // Variabili
    let rootHandle = null;
    let currentFiles = [];
    
    // Wake Lock (schermo acceso)
    let wakeLock = null;
    async function requestWakeLock() {
        if ('wakeLock' in navigator && !wakeLock) {
            try {
                wakeLock = await navigator.wakeLock.request('screen');
                console.log('Wake Lock attivo');
            } catch(e) { console.warn('Wake Lock fallito:', e); }
        }
    }
    function releaseWakeLock() {
        if (wakeLock) {
            wakeLock.release();
            wakeLock = null;
        }
    }
    // Richiedi wake lock all'avvio
    requestWakeLock();
    // Rilascia se la pagina viene nascosta (non necessario, ma buona prassi)
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') requestWakeLock();
        else releaseWakeLock();
    });
    
    // Gestione info testuale (modificabile da admin)
    let infoTexts = {
        expatArchivio: "📁 EXPAT ARCHIVIO\n\n• Seleziona una cartella sul tuo telefono (solo Android).\n• Verranno elencati tutti i file PDF presenti.\n• Clicca su 🔍 per aprire un PDF.\n• Genius Scan può essere usato per scansionare documenti, poi li esporti manualmente nella cartella selezionata.\n\n" + (isIPhone() ? "⚠️ Su iPhone la selezione cartella non è supportata." : "✅ Android: usa Chrome o Edge per la selezione cartella.")
    };
    // Carica testo da localStorage se presente
    const savedInfoTexts = localStorage.getItem('expatArchivioInfoText');
    if (savedInfoTexts) {
        try {
            const parsed = JSON.parse(savedInfoTexts);
            if (parsed.expatArchivio) infoTexts.expatArchivio = parsed.expatArchivio;
        } catch(e) {}
    }
    function saveInfoText() {
        localStorage.setItem('expatArchivioInfoText', JSON.stringify(infoTexts));
    }
    function showInfo() {
        alert(infoTexts.expatArchivio);
    }
    // Per admin: possibilità di modificare il testo (tenendo premuto il pulsante info? opzionale)
    // Aggiungiamo un long-press per modificare (solo se admin autenticato? ma per semplicità usiamo un alert)
    let pressTimer = null;
    infoBtn.addEventListener('mousedown', () => {
        pressTimer = setTimeout(() => {
            let newText = prompt("Modifica il testo informativo (per amministratori):", infoTexts.expatArchivio);
            if (newText !== null && newText.trim() !== "") {
                infoTexts.expatArchivio = newText.trim();
                saveInfoText();
                alert("Testo aggiornato!");
            }
        }, 3000);
    });
    infoBtn.addEventListener('mouseup', () => clearTimeout(pressTimer));
    infoBtn.addEventListener('mouseleave', () => clearTimeout(pressTimer));
    infoBtn.addEventListener('touchstart', () => {
        pressTimer = setTimeout(() => {
            let newText = prompt("Modifica il testo informativo (per amministratori):", infoTexts.expatArchivio);
            if (newText !== null && newText.trim() !== "") {
                infoTexts.expatArchivio = newText.trim();
                saveInfoText();
                alert("Testo aggiornato!");
            }
        }, 3000);
    });
    infoBtn.addEventListener('touchend', () => clearTimeout(pressTimer));
    infoBtn.addEventListener('touchcancel', () => clearTimeout(pressTimer));
    
    // Gestione cartella (IndexedDB per l'handle)
    function openHandleDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open('ExpatArchiveHandles', 1);
            request.onupgradeneeded = () => {
                const db = request.result;
                if (!db.objectStoreNames.contains('handles')) {
                    db.createObjectStore('handles');
                }
            };
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    }
    async function saveRootHandle(handle) {
        const db = await openHandleDB();
        const tx = db.transaction('handles', 'readwrite');
        tx.objectStore('handles').put(handle, 'root');
        await tx.done;
    }
    async function getRootHandle() {
        const db = await openHandleDB();
        const tx = db.transaction('handles', 'readonly');
        const result = await tx.objectStore('handles').get('root');
        return result || null;
    }
    
    async function selectAndShowFolder() {
        if (isIPhone()) {
            alert("La selezione di una cartella non è supportata su iPhone.");
            return;
        }
        if (!window.showDirectoryPicker) {
            alert("Il tuo browser non supporta la selezione di cartelle. Usa Chrome/Edge su Android.");
            return;
        }
        try {
            const handle = await window.showDirectoryPicker();
            rootHandle = handle;
            await saveRootHandle(rootHandle);
            showMessage(`✅ Cartella selezionata: "${rootHandle.name}"`);
            await listPdfFiles();
        } catch(e) {
            if (e.name !== 'AbortError') {
                console.warn(e);
                alert("Errore nella selezione della cartella.");
            }
        }
    }
    
    async function listPdfFiles() {
        if (!rootHandle) {
            fileListArea.innerHTML = "<div style='text-align:center; padding:20px; color:#777;'>Nessuna cartella selezionata. Premi 'Seleziona-Visualizza cartella archivio'.</div>";
            return;
        }
        const files = [];
        try {
            for await (const [name, handle] of rootHandle.entries()) {
                if (handle.kind === 'file' && name.toLowerCase().endsWith('.pdf')) {
                    files.push({ name, handle });
                }
            }
        } catch(e) {
            console.warn(e);
            fileListArea.innerHTML = "<div style='text-align:center; padding:20px; color:#777;'>Errore nella lettura della cartella.</div>";
            return;
        }
        currentFiles = files;
        if (files.length === 0) {
            fileListArea.innerHTML = "<div style='text-align:center; padding:20px; color:#777;'>📭 Nessun file PDF trovato in questa cartella.</div>";
            return;
        }
        let html = "";
        for (const file of files) {
            html += `
                <div class="doc-item">
                    <span class="doc-name">📄 ${escapeHtml(file.name)}</span>
                    <button class="doc-open" data-name="${escapeHtml(file.name)}">🔍</button>
                </div>
            `;
        }
        fileListArea.innerHTML = html;
        document.querySelectorAll('.doc-open').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const fileName = btn.getAttribute('data-name');
                const file = currentFiles.find(f => f.name === fileName);
                if (file && file.handle) {
                    const blob = await file.handle.getFile();
                    const url = URL.createObjectURL(blob);
                    window.open(url, '_blank');
                    setTimeout(() => URL.revokeObjectURL(url), 60000);
                } else {
                    alert("Impossibile aprire il file.");
                }
            });
        });
    }
    
    // Genius Scan (con logo e icona, stesso stile)
    function openGeniusScan() {
        const isAndroid = /Android/.test(navigator.userAgent);
        const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
        let timeoutId = null;
        let hasLostFocus = false;
        const onBlur = () => {
            hasLostFocus = true;
            if (timeoutId) clearTimeout(timeoutId);
            window.removeEventListener('blur', onBlur);
        };
        window.addEventListener('blur', onBlur);
        if (isAndroid) {
            window.location.href = "intent://scan/#Intent;package=com.thegrizzlylabs.geniusscan.free;scheme=zxing;end";
            timeoutId = setTimeout(() => {
                if (!hasLostFocus) {
                    if (confirm("Genius Scan non si è aperto. Potrebbe non essere installato. Vuoi scaricarlo dal Play Store?")) {
                        window.open("https://play.google.com/store/apps/details?id=com.thegrizzlylabs.geniusscan.free", "_blank");
                    }
                }
                window.removeEventListener('blur', onBlur);
            }, 5000);
        } else if (isIOS) {
            window.location.href = "geniuscan://";
            timeoutId = setTimeout(() => {
                if (!hasLostFocus) {
                    if (confirm("Genius Scan non si è aperto. Potrebbe non essere installato. Vuoi scaricarlo dall'App Store?")) {
                        window.open("https://apps.apple.com/app/genius-scan/id377672876", "_blank");
                    }
                }
                window.removeEventListener('blur', onBlur);
            }, 5000);
        } else {
            alert("Questo link funziona solo su dispositivi mobili.");
        }
    }
    
    function showMessage(msg, isError = false) {
        const div = document.createElement('div');
        div.className = 'status-msg';
        div.style.color = isError ? 'red' : 'green';
        div.innerText = msg;
        const container = document.querySelector('.archivio-title');
        container.parentNode.insertBefore(div, container.nextSibling);
        setTimeout(() => div.remove(), 3000);
    }
    
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    async function init() {
        // Recupera handle salvato
        const savedHandle = await getRootHandle();
        if (savedHandle) {
            rootHandle = savedHandle;
            showMessage(`📁 Cartella "${rootHandle.name}" già selezionata.`);
            await listPdfFiles();
        } else {
            fileListArea.innerHTML = "<div style='text-align:center; padding:20px; color:#777;'>Nessuna cartella selezionata. Premi 'Seleziona-Visualizza cartella archivio'.</div>";
        }
        
        selectRootBtn.addEventListener('click', selectAndShowFolder);
        openGeniusScanBtn.addEventListener('click', openGeniusScan);
        infoBtn.addEventListener('click', showInfo); // click breve mostra info
    }
    init();
</script>
</body>
</html>
